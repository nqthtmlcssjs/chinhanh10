<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hệ thống báo cáo nội bộ - Chi nhánh số 10</title>

<link rel="stylesheet" href="style.css?v=1004">
<link rel="icon" type="image/x-icon" href="images/favicon.ico">

<style>
.report-header{background:#fff;border-radius:20px;padding:30px;text-align:center;box-shadow:0 8px 25px rgba(0,0,0,.06);margin-bottom:30px}
.report-header h1{color:#003d82;font-size:30px;margin-bottom:10px}
.report-header p{color:#475569;font-weight:600;font-size:18px}
.report-card a{min-height:180px}
.report-card span{font-size:48px;margin-bottom:12px}
.report-card small{margin-top:10px;color:#64748b;font-weight:600}
.back-home{text-align:center;margin-top:50px}
.back-home a{display:inline-block;background:#0056b3;color:white;padding:14px 28px;border-radius:999px;text-decoration:none;font-weight:800}
.empty-box{background:#fff;border-radius:15px;padding:20px;text-align:center;color:#64748b;font-weight:600;box-shadow:0 8px 25px rgba(0,0,0,.06)}
.auth-box{text-align:center;margin:20px 0}
.auth-box button{background:#0056b3;color:#fff;border:none;padding:10px 18px;border-radius:999px;font-weight:800;cursor:pointer}
</style>
</head>

<body>

<div class="page">

    <div class="report-header">
        <h1>📊 HỆ THỐNG BÁO CÁO NỘI BỘ</h1>
        <p id="ten-diem">Đang tải dữ liệu...</p>
    </div>

    <div id="auth-box" class="auth-box"></div>

    <div id="noi-dung-bao-cao" style="display:none;">
        <h2 class="section-title">📋 Báo cáo chung</h2>
        <section id="bao-cao-chung" class="grid"></section>

        <h2 class="section-title">🏢 Báo cáo riêng</h2>
        <section id="bao-cao-rieng" class="grid"></section>
    </div>

    <div class="back-home">
        <a href="index.html">← Quay lại Trang chủ</a>
    </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

const API_URL = "https://script.google.com/macros/s/AKfycbzgVoPJhFAS3AdWuKk5-W5jXsNPfTxvipIpAV0IxJO285KGOFI5lMRxl6-bFkakuR3U/exec";

const firebaseConfig = {
  apiKey: "AIzaSyCyHS-jYLZQvrysbhV7UhQOtl42CX7Em_g",
  authDomain: "chinhanh10-web.firebaseapp.com",
  projectId: "chinhanh10-web",
  storageBucket: "chinhanh10-web.firebasestorage.app",
  messagingSenderId: "75779781593",
  appId: "1:75779781593:web:5748e89fc7b5dbb3c5dfc8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const TEN_DIEM = {
    TamHung:"Điểm hỗ trợ dịch vụ công số Tam Hưng",
    BinhMinh:"Điểm hỗ trợ dịch vụ công số Bình Minh",
    ThanhOai:"Điểm hỗ trợ dịch vụ công số Thanh Oai",
    DanHoa:"Điểm hỗ trợ dịch vụ công số Dân Hòa",
    UngThien:"Điểm hỗ trợ dịch vụ công số Ứng Thiên",
    VanDinh:"Điểm hỗ trợ dịch vụ công số Vân Đình",
    HoaXa:"Điểm hỗ trợ dịch vụ công số Hòa Xá",
    UngHoa:"Điểm hỗ trợ dịch vụ công số Ứng Hòa",
    MyDuc:"Điểm hỗ trợ dịch vụ công số Mỹ Đức",
    HuongSon:"Điểm hỗ trợ dịch vụ công số Hương Sơn",
    HongSon:"Điểm hỗ trợ dịch vụ công số Hồng Sơn",
    PhucSon:"Điểm hỗ trợ dịch vụ công số Phúc Sơn"
};

const params = new URLSearchParams(window.location.search);
const diem = params.get("diem") || "";
const diemLower = diem.toLowerCase();

document.getElementById("ten-diem").innerText =
    TEN_DIEM[diem] || "Hệ thống báo cáo";

window.loginGoogle = () => {
    signInWithPopup(auth, provider);
};

window.logoutGoogle = () => {
    signOut(auth);
};

function taoCard(item, icon){
    return `
        <div class="item report-card">
            <a href="${item.link}" target="_blank">
                <span>${icon}</span>
                <p>${item.ten}</p>
                <small>Nhấn để mở</small>
            </a>
        </div>
    `;
}

/* Users không cache trình duyệt để cập nhật Gmail nhanh */
async function getUsers(){
    const res = await fetch(API_URL + "?action=users");
    return await res.json();
}

/* Reports cache 10 phút để mở báo cáo nhanh hơn */
const REPORT_CACHE_KEY = "bao_cao_cache";
const REPORT_CACHE_TIME = 10 * 60 * 1000;

async function getReports(){
    const cache = localStorage.getItem(REPORT_CACHE_KEY);

    if (cache) {
        const saved = JSON.parse(cache);
        if (Date.now() - saved.time < REPORT_CACHE_TIME) {
            return saved.data;
        }
    }

    const res = await fetch(API_URL + "?action=reports");
    const data = await res.json();

    localStorage.setItem(
        REPORT_CACHE_KEY,
        JSON.stringify({
            time: Date.now(),
            data: data
        })
    );

    return data;
}

function loadReports(data){
    let htmlChung = "";
    let htmlRieng = "";

    data.forEach(item => {
        const loai = String(item.loai || "").trim().toLowerCase();
        const itemDiem = String(item.diem || "").trim().toLowerCase();

        if (loai === "chung") {
            htmlChung += taoCard(item, "📋");
        }

        if (loai === "rieng" && itemDiem === diemLower) {
            htmlRieng += taoCard(item, "🏢");
        }
    });

    document.getElementById("bao-cao-chung").innerHTML =
        htmlChung || `<div class="empty-box">Chưa có báo cáo chung.</div>`;

    document.getElementById("bao-cao-rieng").innerHTML =
        htmlRieng || `<div class="empty-box">Chưa có báo cáo riêng cho điểm này.</div>`;
}

onAuthStateChanged(auth, async (user) => {
    const authBox = document.getElementById("auth-box");
    const noiDung = document.getElementById("noi-dung-bao-cao");

    if (!user) {
        noiDung.style.display = "none";
        authBox.innerHTML = `
            <p>🔒 Bạn cần đăng nhập để xem báo cáo.</p>
            <button onclick="loginGoogle()">Đăng nhập Google</button>
        `;
        return;
    }

    try {
        const [users, reports] = await Promise.all([
            getUsers(),
            getReports()
        ]);

        const email = user.email.toLowerCase().trim();

        const currentUser = users.find(u =>
            String(u.email).toLowerCase().trim() === email
        );

        if (!currentUser) {
            noiDung.style.display = "none";
            authBox.innerHTML = `
                <p style="color:#dc2626;font-weight:800;">
                    ⛔ Tài khoản ${email} không có quyền truy cập.
                </p>
                <button onclick="logoutGoogle()">Đăng xuất</button>
            `;
            return;
        }

        const quyen = String(currentUser.quyen || "").toLowerCase().trim();
        const userDiem = String(currentUser.diem || "").toLowerCase().trim();

        const duocVao =
            quyen === "admin" ||
            quyen === "user" ||
            (quyen === "diem" && userDiem === diemLower);

        if (!duocVao) {
            noiDung.style.display = "none";
            authBox.innerHTML = `
                <p style="color:#dc2626;font-weight:800;">
                    ⛔ Bạn chỉ được xem báo cáo của điểm được phân quyền.
                </p>
                <button onclick="logoutGoogle()">Đăng xuất</button>
            `;
            return;
        }

        authBox.innerHTML = `
            <p>
                👤 Đang đăng nhập:
                <b>${currentUser.hoten || user.displayName}</b>
                (${email})
                <button onclick="logoutGoogle()">Đăng xuất</button>
            </p>
        `;

        noiDung.style.display = "block";
        loadReports(reports);

    } catch (error) {
        console.error(error);

        noiDung.style.display = "none";

        authBox.innerHTML = `
            <p style="color:#dc2626;font-weight:800;">
                Không tải được dữ liệu báo cáo.
            </p>
            <button onclick="logoutGoogle()">Đăng xuất</button>
        `;
    }
});
</script>

</body>
</html>
